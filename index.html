<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jawad Mustafa</title>
  <meta name="description" content="Jawad Mustafa: software architect working on distributed backend systems, cloud infrastructure and model-driven reverse engineering.">
  <link rel="icon" href="solid_color.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f6f2; --ink: #17202b; --muted: #5e6875; --rule: #d6dbd8; --accent: #1f5e57;
      --serif: "Literata", Georgia, serif;
      --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #141a1f; --ink: #e4e8e6; --muted: #98a3ad; --rule: #2c353d; --accent: #7cc4b8; }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.7 var(--serif); }
    a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .page { display: grid; grid-template-columns: 15rem minmax(0, 42rem); gap: 5rem; max-width: 66rem; margin: 0 auto; padding: 5rem 2rem 6rem; }
    aside { position: sticky; top: 5rem; align-self: start; font-family: var(--sans); }
    .name { font-size: 2rem; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 .75rem; }
    .role { color: var(--muted); font-size: .95rem; line-height: 1.5; margin: 0 0 1.5rem; }
    aside ul { list-style: none; padding: 0; margin: 0 0 1.5rem; font-size: .95rem; line-height: 2; }
    aside nav a { color: var(--ink); text-decoration: none; }
    aside nav a:hover { color: var(--accent); }

    .lede { font-size: 1.6rem; line-height: 1.4; margin: 0 0 1.5rem; }
    .about { color: var(--muted); margin: 0; }
    section { margin-top: 4rem; }
    h2 { font: 700 1rem/1.3 var(--sans); margin: 0 0 1.5rem; padding-bottom: .5rem; border-bottom: 1px solid var(--rule); }
    h3 { font: 500 1.0625rem/1.45 var(--serif); margin: 0; }
    .row { display: grid; grid-template-columns: 8.5rem 1fr; gap: 1.5rem; margin-bottom: 1.75rem; }
    .when { color: var(--muted); font: .9rem/1.9 var(--sans); font-variant-numeric: tabular-nums; }
    .meta { color: var(--muted); margin: 0; }
    .row ul { margin: .35rem 0 0; padding-left: 1.1rem; }
    .row li { margin-bottom: .25rem; }
    .plain { list-style: none; padding: 0; margin: 0; }
    .plain li { margin-bottom: .6rem; }

    @media (max-width: 52rem) {
      .page { grid-template-columns: 1fr; gap: 3rem; padding: 3rem 1.25rem 4rem; }
      aside { position: static; }
      aside nav ul { display: flex; flex-wrap: wrap; gap: 0 1.25rem; }
      .lede { font-size: 1.35rem; }
      .row { grid-template-columns: 1fr; gap: .1rem; }
    }
  </style>
</head>
<body>
  <script src="resume-data.js"></script>
  <div class="page">
    <aside>
      <h1 class="name" id="name"></h1>
      <p class="role" id="role"></p>
      <ul id="links"></ul>
      <nav aria-label="Sections"><ul>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#awards">Awards</a></li>
      </ul></nav>
    </aside>

    <main>
      <p class="lede" id="lede"></p>
      <p class="about" id="about"></p>
      <section id="publications"><h2>Publications</h2><div id="pub-list"></div></section>
      <section id="experience"><h2>Experience</h2><div id="exp-list"></div></section>
      <section id="projects"><h2>Selected projects</h2><div id="proj-list"></div></section>
      <section id="education"><h2>Education</h2><div id="edu-list"></div></section>
      <section id="awards"><h2>Awards</h2><ul class="plain" id="award-list"></ul></section>
      <section id="volunteering"><h2>Volunteering</h2><ul class="plain" id="vol-list"></ul></section>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const link = (text, href) => href ? `<a href="${href}">${text}</a>` : text;
    const row = (when, body) => `<div class="row"><div class="when">${when}</div><div>${body}</div></div>`;
    const bullets = pts => pts.length ? `<ul>${pts.map(p => `<li>${p}</li>`).join('')}</ul>` : '';

    $('name').textContent = profile.name;
    $('role').textContent = `${profile.role}, ${profile.location}`;
    $('lede').textContent = profile.lede;
    $('about').textContent = profile.about;
    $('links').innerHTML = `<li><a href="mailto:${profile.email}">${profile.email}</a></li>` +
      Object.entries(profile.links).map(([k, v]) => `<li><a href="${v}">${k}</a></li>`).join('');

    $('pub-list').innerHTML = resumeData.publications.map(p => row(p.year,
      `<h3>${link(p.title, p.link)}</h3>` +
      [p.authors, p.venue].filter(Boolean).map(t => `<p class="meta">${t}</p>`).join(''))).join('');

    $('exp-list').innerHTML = resumeData.experience.map(e => row(e.dates,
      `<h3>${e.title}, ${e.org}</h3><p class="meta">${e.place}</p>${bullets(e.points)}`)).join('');

    $('proj-list').innerHTML = resumeData.projects.map(p => row(p.context,
      `<h3>${link(p.title, p.link)}</h3><p class="meta">${p.text}</p>`)).join('');

    $('edu-list').innerHTML = resumeData.education.map(e => row(e.dates,
      `<h3>${e.degree}</h3><p class="meta">${e.org}. ${e.note}</p>`)).join('');

    $('award-list').innerHTML = resumeData.awards.map(a => `<li>${a}</li>`).join('');
    $('vol-list').innerHTML = resumeData.volunteering.map(v => `<li>${v}</li>`).join('');
  </script>
</body>
</html>
